name = "goldbach"
version = "1.0.0"
keywords = ["mathematics", "number-theory", "chen-theorem"]
defaultTargets = ["Goldbach", "MathlibNt", "AnalyticNumberTheory", "PrimeNumberTheoremAnd"]

[[require]]
name = "LeanArchitect"
git = "https://github.com/hanwenzhu/LeanArchitect.git"
rev = "9f3bb53916b9d6fa05b7777389e1844f82b1c9a6"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "56a005855ea17e0b0958f73ec801ae140b0a1679"

[[lean_lib]]
name = "PrimeNumberTheoremAnd"
globs = ["PrimeNumberTheoremAnd.+"]

[[lean_lib]]
name = "AnalyticNumberTheory"
globs = ["AnalyticNumberTheory", "AnalyticNumberTheory.+"]

[[lean_lib]]
name = "MathlibNt"
globs = ["MathlibNt", "MathlibNt.+"]

[[lean_lib]]
name = "Goldbach"
globs = ["Goldbach", "Goldbach.+"]

# Independent specification and proved implementations for Palomar comparison.
[[lean_lib]]
name = "Palomar"
globs = ["Palomar.Challenge", "Palomar.Solution"]
