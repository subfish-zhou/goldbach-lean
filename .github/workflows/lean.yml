name: Lean verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      LEAN_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          printf '%s\n' "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch dependency cache
        run: lake exe cache get
      - name: Build all libraries without warnings
        run: lake --wfail build
      - name: Check sources, statements and axioms
        run: python3 scripts/check.py
      - name: Test verification scripts
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Replay public theorem
        run: lake env leanchecker --verbose Goldbach.Theorem
      - name: Install blueprint renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz libgraphviz-dev pkg-config texlive-binaries
          python3 -m venv .venv-blueprint
          .venv-blueprint/bin/pip install -r blueprint/requirements.txt
      - name: Extract and render blueprint
        run: |
          lake build Goldbach:blueprint
          source .venv-blueprint/bin/activate
          leanblueprint web 2>&1 | tee "$RUNNER_TEMP/blueprint.log"
          ! grep -E 'ERROR:|could not be resolved|File not found:' "$RUNNER_TEMP/blueprint.log"
          test -s blueprint/web/index.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          import pygraphviz
          page = Path("blueprint/web/dep_graph_document.html").read_text()
          graph = pygraphviz.AGraph(re.search(r"\.renderDot\(`(.*?)`\)", page, re.S).group(1))
          assert graph.number_of_nodes() == 7 and graph.number_of_edges() == 6
          assert "mathlib4_docs/find" not in page
          PY
      - name: Upload blueprint website
        uses: actions/upload-artifact@v4
        with:
          name: goldbach-blueprint
          path: blueprint/web
          if-no-files-found: error
      - name: Build and validate Lean API documentation
        run: python3 scripts/build_docs.py --blueprint blueprint/web
      - name: Upload complete documentation website
        uses: actions/upload-pages-artifact@v3
        with:
          path: docbuild/.lake/build/site

  deploy:
    name: Publish documentation
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified documentation
        id: deployment
        uses: actions/deploy-pages@v4
