name: Lean verification

on:
  push:
    branches-ignore: [gh-pages]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  verify:
    runs-on: ubuntu-latest
    # A cold build has a separate budget from documentation; this is not a speedup.
    timeout-minutes: 180
    env:
      LEAN_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          printf '%s\n' "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch dependency cache
        run: lake exe cache get
      - name: Restore project build cache
        id: project-cache
        uses: actions/cache@v4
        with:
          path: .lake/build
          key: lean-project-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}
          restore-keys: |
            lean-project-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-
      - name: Record runner and exact cache-hit context
        env:
          PROJECT_CACHE_EXACT_HIT: ${{ steps.project-cache.outputs.cache-hit }}
        run: |
          {
            git rev-parse HEAD
            printf 'project-cache-exact-hit=%s\n' "$PROJECT_CACHE_EXACT_HIT"
            lscpu
            free -h
            df -h .
            lean --version
            lake --version
            if test -d .lake/build; then du -sh .lake/build; fi
          } | tee "$RUNNER_TEMP/runner-context.log"
      # Always run Lake, even on an exact cache hit. Source and dependency traces
      # determine which modules must be rebuilt; cached outputs do not skip checks.
      - name: Build all libraries without warnings
        timeout-minutes: 160
        run: /usr/bin/time -v lake --wfail build 2>&1 | tee "$RUNNER_TEMP/lean-build.log"
      - name: Check sources, statements and axioms
        run: python3 scripts/check.py
      - name: Test verification scripts
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Replay public theorems and check probes
        run: |
          lake env leanchecker --verbose Goldbach.Theorem
          lake env leanchecker --verbose Goldbach.Checks
          lake env leanchecker --verbose Goldbach.OnePlusOneNine
          lake env leanchecker --verbose Goldbach.OnePlusOneNineChecks
          lake env leanchecker --verbose Goldbach.All
      - name: Upload build timing log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-build-timing-${{ github.sha }}
          path: |
            ${{ runner.temp }}/lean-build.log
            ${{ runner.temp }}/runner-context.log
          if-no-files-found: ignore

# Static documentation is built and validated locally, then published to gh-pages.
# Proof CI remains independent and never deploys the website.
